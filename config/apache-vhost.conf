<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks Indexes
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/Baymax_Voting_System>
        Options FollowSymLinks Indexes
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/Baymax_Voting_System/public>
        Options FollowSymLinks Indexes
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>

    # Hardened Logging: Excludes query strings (%q / %r) and User-Agent to eliminate credential leakage
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b %D" verityvote_secure
    ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P:tid %T] %7F: %E: [client\ %a] %M"

    ErrorLog ${APACHE_LOG_DIR}/verityvote_error.log
    CustomLog ${APACHE_LOG_DIR}/verityvote_access.log verityvote_secure
</VirtualHost>
