# VerityVote Hardened Logging Configuration
# Eliminates query-string and credential leakage in Apache access and error logs
# Compatible with Apache 2.4+ (Windows XAMPP and Linux)

<IfModule log_config_module>
    # Hardened Access Log Format:
    # Uses %m (method), %U (URL path excluding query string), %H (protocol) instead of %r
    # Preserves client IP, timestamp, HTTP status, response bytes, and duration (%D in microseconds)
    # Excludes query strings (%q), User-Agent (%{User-Agent}i), and Referer (%{Referer}i) to prevent credential injection
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b %D" verityvote_secure
</IfModule>

<IfModule core_module>
    # Hardened Error Log Format:
    # Excludes raw request lines and referers containing query strings
    ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P:tid %T] %7F: %E: [client\ %a] %M"
</IfModule>
