name: VerityVote CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Full Verification Suite (Lint, Migrate, Concurrency & Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:10.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: verityvote_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl, mbstring, fileinfo, pdo, pdo_mysql, openssl
          ini-values: error_reporting=E_ALL, display_errors=On, date.timezone=Asia/Kolkata
          coverage: none

      - name: Install and configure Apache
        run: |
          set -e
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y apache2 libapache2-mod-php8.2

          # Ensure mpm_prefork is active for mod_php and enable required modules
          sudo a2dismod mpm_event || true
          sudo a2enmod mpm_prefork || true
          sudo a2enmod php8.2 rewrite headers

          # Ensure runner user and Apache permissions
          sudo chmod 755 /home/runner
          sudo chmod -R 755 /home/runner/work
          mkdir -p storage/logs storage/backups storage/uploads
          sudo chmod -R 777 storage

          # Create directory link in Apache web root
          sudo ln -s "$GITHUB_WORKSPACE" /var/www/html/Baymax_Voting_System

          # Configure VirtualHost with AllowOverride All
          sudo cp config/apache-vhost.conf /etc/apache2/sites-available/000-default.conf

          # Verify configuration and start Apache
          sudo apache2ctl configtest
          sudo systemctl restart apache2
          sudo systemctl status apache2 --no-pager

      - name: Verify MariaDB connection & configure database permissions
        run: |
          set -e
          mysqladmin ping -h 127.0.0.1 -u root --silent
          echo "MariaDB service container is responding on 127.0.0.1:3306"
          mysql -h 127.0.0.1 -u root -e "GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' IDENTIFIED BY '' WITH GRANT OPTION; FLUSH PRIVILEGES;"

      - name: Initialize application configuration
        run: |
          set -e
          cp config/config.example.php config/config.php
          mkdir -p storage/logs

      - name: Verify Apache + PHP HTTP Integration
        run: |
          set -e
          echo "Probing Apache HTTP root and public router..."
          ROOT_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/Baymax_Voting_System/)
          echo "Root HTTP Status: $ROOT_CODE"
          LOGIN_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/Baymax_Voting_System/public/login)
          echo "Login Portal HTTP Status: $LOGIN_CODE"
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "::error::Apache failed to serve /public/login (got $LOGIN_CODE)"
            sudo cat /var/log/apache2/verityvote_error.log || true
            sudo cat /var/log/apache2/error.log || true
            exit 1
          fi
          echo "Apache + PHP front controller verified with HTTP 200 OK."

      - name: 1. Validate PHP syntax (Lint)
        run: |
          set -o pipefail
          php bin/lint_all.php | tee storage/logs/ci_lint.log

      - name: 2. Initialize database schema & apply migrations
        run: |
          set -o pipefail
          php bin/check_db.php | tee storage/logs/ci_db.log

      - name: 3. Run complete verification suite
        run: |
          set -o pipefail
          php tests/run_tests.php | tee storage/logs/ci_tests.log

      - name: 4. Generate GitHub Actions step summary
        if: always()
        run: |
          set -o pipefail
          php bin/generate_ci_summary.php storage/logs/ci_lint.log storage/logs/ci_db.log storage/logs/ci_tests.log

      - name: Clean up test artifacts
        if: always()
        run: |
          rm -f storage/.test_database_override || true
          rm -f storage/logs/ci_*.log || true
